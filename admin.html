<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — MIDNIGHT // COMPILE</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F7F2EB;--ink:#0c0c0c;--red:#E63B2E;--line:rgba(12,12,12,.1)}
  *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,sans-serif;padding:40px 20px}
  h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:26px;margin:0}.login{max-width:360px;margin:80px auto;background:#fff;border:1px solid var(--line);padding:32px}
  input{width:100%;padding:12px;margin:14px 0;border:1px solid rgba(12,12,12,.2);background:var(--cream);font-family:Inter,sans-serif}.button{width:100%;padding:13px;background:var(--ink);color:#fff;border:0;font-family:'Space Mono',monospace;cursor:pointer}
  .back-home{display:block;margin-top:12px;text-align:center;font-family:'Space Mono',monospace;font-size:12px;color:var(--ink);text-decoration:none;opacity:.65}.back-home:hover{color:var(--red);opacity:1}.err{color:var(--red);font-size:13px;min-height:18px}
  .topbar{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto 20px}.logout{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink);opacity:.65;text-decoration:none;background:transparent;border:0;cursor:pointer}
  table{width:100%;max-width:1000px;margin:0 auto;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.05em;opacity:.6}.leader-tag{color:var(--red);font-family:'Space Mono',monospace;font-size:10px}.empty{text-align:center;padding:40px;opacity:.5;font-family:'Space Mono',monospace}.hidden{display:none}
</style>
</head>
<body>
  <main id="loginView">
    <form class="login" id="loginForm">
      <h1>Admin access</h1>
      <p class="err" id="loginError"></p>
      <input type="password" id="password" placeholder="Admin password" autocomplete="current-password" autofocus required>
      <button class="button" type="submit">Enter</button>
      <a class="back-home" href="index.html">← Back to Home</a>
    </form>
  </main>
  <main id="teamsView" class="hidden">
    <div class="topbar"><h1>Registered teams</h1><button class="logout" id="logoutBtn">log out</button></div>
    <div id="teamContent"></div>
  </main>
<script>
const loginView = document.getElementById('loginView');
const teamsView = document.getElementById('teamsView');
const content = document.getElementById('teamContent');
const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
function showTeams(teams) {
  loginView.classList.add('hidden'); teamsView.classList.remove('hidden');
  if (!teams.length) { content.innerHTML = '<p class="empty">No registrations yet.</p>'; return; }
  content.innerHTML = `<table><thead><tr><th>Team</th><th>Leader</th><th>Members</th><th>Registered</th></tr></thead><tbody>${teams.map(team => `<tr><td><strong>${escapeHtml(team.team_name)}</strong></td><td>${escapeHtml(team.leader_name)} <span class="leader-tag">LEADER</span></td><td>${team.members.map(member => `${escapeHtml(member.name)} (${escapeHtml(member.className)})`).join('<br>')}</td><td>${new Date(team.created_at).toLocaleString()}</td></tr>`).join('')}</tbody></table>`;
}
async function loadTeams() {
  const response = await fetch('/api/admin');
  if (response.ok) { showTeams((await response.json()).teams); return true; }
  return false;
}
document.getElementById('loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  const error = document.getElementById('loginError'); error.textContent = '';
  const response = await fetch('/api/admin', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:document.getElementById('password').value})});
  const result = await response.json();
  if (response.ok) loadTeams(); else error.textContent = result.message || 'Could not sign in.';
});
document.getElementById('logoutBtn').addEventListener('click', async () => { await fetch('/api/admin', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})}); location.reload(); });
loadTeams();
</script>
</body>
</html>
